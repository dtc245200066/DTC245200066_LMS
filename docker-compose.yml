version: '3.8'

networks:
  frontend-network:
    driver: bridge
  backend-network:
    driver: bridge

volumes:
  db_data:
  prometheus_data:
  grafana_data:
  loki_data:

services:
  database:
    image: mysql:8.0
    container_name: lms_mysql
    restart: always
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-SuperSecr3t_RootP@ssw0rd!2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lms_school_db}
      MYSQL_USER: ${MYSQL_USER:-lms_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-Lms_Stud3nt_S3curePass#2026}
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - backend-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: lms_phpmyadmin
    restart: always
    environment:
      PMA_HOST: database
      PMA_USER: ${MYSQL_USER:-lms_user}
      PMA_PASSWORD: ${MYSQL_PASSWORD:-Lms_Stud3nt_S3curePass#2026}
      PMA_ABSOLUTE_URI: https://localhost/pma/
    networks:
      - backend-network
      - frontend-network
    depends_on:
      - database

  lms-app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: lms_web_app
    restart: always
    environment:
      DB_HOST: database
      DB_USER: ${MYSQL_USER:-lms_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-Lms_Stud3nt_S3curePass#2026}
      DB_NAME: ${MYSQL_DATABASE:-lms_school_db}
      PORT: 3000
    networks:
      - frontend-network
      - backend-network
    depends_on:
      - database

  reverse-proxy:
    image: nginx:alpine
    container_name: lms_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - frontend-network
    depends_on:
      - lms-app
      - phpmyadmin

  node-exporter:
    image: prom/node-exporter:latest
    container_name: lms_node_exporter
    restart: always
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - backend-network

  prometheus:
    image: prom/prometheus:latest
    container_name: lms_prometheus
    restart: always
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    networks:
      - backend-network
    depends_on:
      - node-exporter

  grafana:
    image: grafana/grafana:latest
    container_name: lms_grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=GrafanaAdmin#2026
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    networks:
      - backend-network
      - frontend-network
    depends_on:
      - prometheus

  # ================= LOGGING STACK (COMMIT 3) =================
  loki:
    image: grafana/loki:latest
    container_name: lms_loki
    restart: always
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    networks:
      - backend-network

  promtail:
    image: grafana/promtail:latest
    container_name: lms_promtail
    restart: always
    user: "0:0"
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - backend-network
    depends_on:
      - loki
